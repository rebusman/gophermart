# Конфигурация проверки OpenAPI-контракта.
#
# Запуск: make openapi-lint
extends:
  - recommended

rules:
  # В репозитории нет файла LICENSE, поэтому указывать лицензию в контракте
  # было бы выдумкой.
  info-license: off

  # Сервис учебный и запускается локально: localhost — это и есть корректный
  # адрес, а не заглушка вместо реального.
  no-server-example.com: off

apis:
  gophermart:
    root: ./openapi.yaml
